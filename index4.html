<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BECRP — Menu Principal</title>
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/variaveis.css">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/icons.css">
<style>
:root{
  --hub-bg:#0b1220;
  --hub-surface:rgba(255,255,255,.06);
  --hub-surface-hover:rgba(255,255,255,.11);
  --hub-border:rgba(255,255,255,.12);
  --hub-text:#f3f6fb;
  --hub-muted:#9aa6b8;
  --hub-accent:#14b8a6;
  --hub-accent-soft:rgba(20,184,166,.16);
  --hub-radius:18px;
  --hub-shadow:0 18px 50px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  min-height:100vh;
  color:var(--hub-text);
  font-family:var(--font-family, "Inter", system-ui, sans-serif);
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(20,184,166,.22), transparent 55%),
    radial-gradient(900px 500px at 100% 100%, rgba(59,130,246,.12), transparent 50%),
    linear-gradient(160deg, #071018 0%, #0b1220 45%, #101826 100%);
}

.hub{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:28px 20px 40px;
}

.hub-top{
  width:min(1080px,100%);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:28px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand-mark{
  width:42px;height:42px;border-radius:12px;
  display:grid;place-items:center;
  background:var(--hub-accent-soft);
  color:var(--hub-accent);
  font-size:22px;font-weight:700;
}
.brand h1{
  margin:0;font-size:1.35rem;letter-spacing:-.02em;font-weight:700;
}
.brand p{
  margin:2px 0 0;font-size:.82rem;color:var(--hub-muted);
}
.user-box{
  display:flex;align-items:center;gap:12px;
  background:var(--hub-surface);
  border:1px solid var(--hub-border);
  border-radius:999px;
  padding:8px 8px 8px 14px;
}
.user-box strong{font-size:.9rem;font-weight:600}
.user-box span{display:block;font-size:.72rem;color:var(--hub-muted)}
.btn-logout{
  border:0;cursor:pointer;
  background:rgba(239,68,68,.15);
  color:#fca5a5;
  border-radius:999px;
  padding:8px 14px;
  font-size:.8rem;font-weight:600;
}
.btn-logout:hover{background:rgba(239,68,68,.28)}

.hub-center{
  width:min(1080px,100%);
  text-align:center;
}
.hub-center .greeting{
  margin:0 0 6px;
  font-size:1.75rem;
  font-weight:700;
  letter-spacing:-.03em;
}
.hub-center .subtitle{
  margin:0 0 28px;
  color:var(--hub-muted);
  font-size:.95rem;
}
.hub-back{
  display:none;
  margin:0 auto 18px;
  border:1px solid var(--hub-border);
  background:var(--hub-surface);
  color:var(--hub-text);
  border-radius:999px;
  padding:8px 16px;
  font-size:.82rem;
  font-weight:600;
  cursor:pointer;
}
.hub-back:hover{background:var(--hub-surface-hover);border-color:rgba(20,184,166,.45)}
.hub-back.visible{display:inline-flex;align-items:center;gap:8px}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
  gap:16px;
  max-width:920px;
  margin:0 auto;
}

.card{
  appearance:none;
  -webkit-appearance:none;
  font:inherit;
  text-decoration:none;
  color:inherit;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  min-height:148px;
  padding:22px 14px;
  border-radius:var(--hub-radius);
  background:var(--hub-surface);
  border:1px solid var(--hub-border);
  box-shadow:var(--hub-shadow);
  backdrop-filter:blur(10px);
  transition:transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
  cursor:pointer;
}
.card:disabled{pointer-events:none}
.card:hover,.card:focus-visible{
  transform:translateY(-4px);
  background:var(--hub-surface-hover);
  border-color:rgba(20,184,166,.45);
  box-shadow:0 22px 55px rgba(0,0,0,.4);
  outline:none;
}
.card-icon{
  width:54px;height:54px;border-radius:16px;
  display:grid;place-items:center;
  background:var(--hub-accent-soft);
  color:var(--hub-accent);
}
.card-icon .icon{width:28px;height:28px}
.card-label{
  font-size:.95rem;
  font-weight:600;
  letter-spacing:-.01em;
}
.card-hint{
  font-size:.72rem;
  color:var(--hub-muted);
  margin-top:-4px;
}

.hub-footer{
  margin-top:32px;
  font-size:.75rem;
  color:var(--hub-muted);
}

.loading,.error{
  color:var(--hub-muted);
  padding:40px 0;
}
.error{color:#fca5a5}

@media (max-width:640px){
  .hub{justify-content:flex-start;padding-top:20px}
  .hub-top{flex-direction:column;align-items:stretch}
  .user-box{justify-content:space-between}
  .hub-center .greeting{font-size:1.4rem}
  .cards{grid-template-columns:repeat(2,1fr);gap:12px}
  .card{min-height:128px}
}
</style>
</head>
<body>

<div class="hub">
  <header class="hub-top">
    <div class="brand">
      <div class="brand-mark">✦</div>
      <div>
        <h1>BECRP</h1>
        <p>BusinessCore Retail CRP</p>
      </div>
    </div>
    <div class="user-box">
      <div>
        <strong id="user-name">—</strong>
        <span id="user-role">usuário</span>
      </div>
      <button type="button" class="btn-logout" id="btn-logout">Sair</button>
    </div>
  </header>

  <section class="hub-center">
    <h2 class="greeting" id="greeting">Olá</h2>
    <p class="subtitle" id="subtitle">Escolha um módulo para continuar</p>
    <button type="button" class="hub-back" id="hub-back">← Voltar aos módulos</button>
    <div class="cards" id="cards">
      <div class="loading">Carregando módulos...</div>
    </div>
  </section>

  <footer class="hub-footer">✦ Palmarante Sistemas — BECRP v1.0</footer>
</div>

<script>
(function () {
  const token = localStorage.getItem("auth_token");
  const raw = localStorage.getItem("user_data");
  if (!token || !raw) {
    location.href = "index.html";
    return;
  }

  let user;
  try { user = JSON.parse(raw); } catch { location.href = "index.html"; return; }

  // RFC: vendedor→PDV, caixa→caixa da loja (mesma regra do login).
  if (user.pos === "pdv") { location.href = "pages/pos.html?mode=pdv"; return; }
  if (user.pos === "caixa") { location.href = "pages/pos.html?mode=caixa"; return; }

  const PAGE_MAP = {
    nfe: "pages/nfe.html",
    nfce: "pages/nfce.html",
    nfse: "pages/nfse.html",
    cte: "pages/cte.html",
    mdfe: "pages/mdfe.html",
    sped: "pages/sped.html",
    produtos: "pages/produtos.html",
    "produtos-vendas": "pages/produtos.html",
    categorias: "pages/categorias.html",
    fornecedores: "pages/fornecedores.html",
    parceiros: "pages/parceiros.html",
    contatos: "pages/contatos.html",
    "contatos-vendas": "pages/parceiros.html?role=CUSTOMER",
    certificados: "pages/certificados.html",
    "config-certificados": "pages/certificados.html",
    empresas: "pages/empresas.html",
    "config-empresas": "pages/empresas.html",
    "cfg-multiempresa": "pages/empresas.html",
    usuarios: "pages/usuarios.html",
    permissoes: "pages/permissoes.html",
    sistema: "pages/configuracoes.html",
    configuracoes: "pages/configuracoes.html",
    apps: "pages/apps.html",
    "apps-cfg": "pages/apps.html",
    "setup-wizard": "pages/setup-wizard.html",
    faturamento: "pages/faturamento.html",
    faturas: "pages/faturamento.html",
    "notas-fiscais": "pages/nfe.html",
    funcionarios: "pages/funcionarios.html",
    cadastro: "pages/funcionarios.html",
    folha: "pages/folha.html",
    ponto: "pages/ponto.html",
    "relatorios-rh": "pages/relatorios_rh.html",
    "rh-dashboard": "pages/rh_dashboard.html",
    pos: "pages/pos.html",
    pdv: "pages/pos.html",
    caixa: "pages/pos.html",
    suporte: "pages/pos.html",
    recebimento: "pages/recebimento.html",
    estoque: "pages/estoque.html",
    inventario: "pages/estoque.html",
    wms: "pages/wms-workspace.html",
    "wms-workspace": "pages/wms-workspace.html",
    "wms-analytics": "pages/wms-analytics.html",
    "wms-armazens": "pages/wms-armazens.html",
    "wms-localizacoes": "pages/wms-localizacoes.html",
    "wms-regras": "pages/wms-regras.html",
    "wms-rotas": "pages/wms-rotas.html",
    "wms-tipos-operacao": "pages/wms-tipos-operacao.html",
    "wms-operacoes": "pages/wms-operacoes.html",
    "wms-tarefas": "pages/wms-tarefas.html",
    "wms-picking": "pages/wms-picking.html",
    "wms-recebimento": "pages/wms-recebimento.html",
    "recebimento-wms": "pages/wms-recebimento.html",
    "wms-expedicao": "pages/wms-expedicao.html",
    delivery: "pages/entregas-workspace.html",
    entregas: "pages/entregas.html",
    "entregas-workspace": "pages/entregas-workspace.html",
    "entregas-dashboard": "pages/entregas-dashboard.html",
    "entregas-fila": "pages/entregas-fila.html",
    "entregas-planejamento": "pages/entregas-planejamento.html",
    "entregas-calendario": "pages/entregas-calendario.html",
    "entregas-manifesto": "pages/entregas-manifesto.html",
    "entregas-viagem": "pages/entregas-viagem.html",
    "entregas-motorista": "pages/entregas-motorista.html",
    "entregas-paradas": "pages/entregas-paradas.html",
    "estoque-wms": "pages/estoque.html",
    "recebimento-wms": "pages/recebimento.html",
    vendas: "pages/vendas.html#dashboard",
    "pedidos-venda": "pages/vendas.html#pedidos",
    cotacoes: "pages/vendas.html#cotacoes",
    orcamentos: "pages/vendas.html#orcamentos",
    contratos: "pages/vendas.html#contratos",
    "lista-precos": "pages/listas-preco.html",
    campanhas: "pages/campanhas.html",
    "plano-contas": "pages/plano-contas.html",
    diarios: "pages/diarios.html",
    lancamentos: "pages/lancamentos.html",
    razao: "pages/razao.html",
    posting: "pages/posting.html",
    periodos: "pages/periodos.html",
    "relatorios-contabeis": "pages/relatorios-contabeis.html",
    "integracao-contabil": "pages/integracao-contabil.html",
    "analytics-contabil": "pages/analytics-contabil.html",
    contabilidade: "pages/contabilidade.html",
    clientes: "pages/parceiros.html?role=CUSTOMER",
    dashboard: "index4.html"
  };

  let menuData = [];
  let currentModule = null;

  function resolveHref(item) {
    if (!item) return null;
    const href = (item.href || "").trim();
    if (href && href !== "#" && !href.startsWith("?")) return href;
    if (PAGE_MAP[item.id]) return PAGE_MAP[item.id];
    return null;
  }

  function moduleApps(mod) {
    return (mod.apps || []).filter(a => a && !a.section && a.id);
  }

  function greet(nome) {
    const h = new Date().getHours();
    let g = "Olá";
    if (h < 12) g = "Bom dia";
    else if (h < 18) g = "Boa tarde";
    else g = "Boa noite";
    document.getElementById("greeting").textContent = g + ", " + (nome || "usuário");
  }

  async function validate() {
    try {
      const res = await fetch("/api/auth/me", { headers: { "X-Auth-Token": token } });
      const data = await res.json();
      if (data.status !== "ok") throw new Error("invalid");
      user = data.conta;
      localStorage.setItem("user_data", JSON.stringify(user));
    } catch {
      localStorage.removeItem("auth_token");
      localStorage.removeItem("user_data");
      location.href = "index.html";
    }
  }

  function cardHtml(item, { href, hint, openModule }) {
    const clickable = !!(href || openModule);
    const style = clickable ? "" : ' style="opacity:.45;cursor:default" title="Em breve"';
    const data = openModule ? ` data-module="${openModule}"` : "";
    const tag = href ? "a" : "button";
    const attrs = href
      ? `href="${href}" class="card"${data}`
      : `type="button" class="card"${data}${style}${clickable ? "" : " disabled"}`;
    return `<${tag} ${attrs}>
      <span class="card-icon"><svg class="icon"><use href="#${item.icon || "icon-file-text"}"/></svg></span>
      <span class="card-label">${item.label}</span>
      <span class="card-hint">${hint}</span>
    </${tag}>`;
  }

  function setLevel(mod) {
    currentModule = mod || null;
    const back = document.getElementById("hub-back");
    const subtitle = document.getElementById("subtitle");
    if (currentModule) {
      back.classList.add("visible");
      subtitle.textContent = currentModule.label + " — escolha a página";
      history.replaceState(null, "", "#mod=" + encodeURIComponent(currentModule.id));
    } else {
      back.classList.remove("visible");
      subtitle.textContent = "Escolha um módulo para continuar";
      history.replaceState(null, "", location.pathname);
    }
  }

  function renderModules() {
    setLevel(null);
    const el = document.getElementById("cards");
    const items = menuData.filter(m => !m.section && m.id !== "dashboard");
    if (!items.length) {
      el.innerHTML = '<div class="error">Nenhum módulo disponível</div>';
      return;
    }
    el.innerHTML = items.map(m => {
      const apps = moduleApps(m);
      const href = resolveHref(m);
      if (apps.length > 1) {
        return cardHtml(m, {
          hint: apps.length + " páginas",
          openModule: m.id
        });
      }
      const only = apps[0];
      const target = (only && resolveHref(only)) || href;
      return cardHtml(m, {
        href: target,
        hint: target ? "Abrir" : "Em breve"
      });
    }).join("");
  }

  function renderApps(mod) {
    setLevel(mod);
    const el = document.getElementById("cards");
    const apps = moduleApps(mod);
    if (!apps.length) {
      const href = resolveHref(mod);
      if (href) {
        location.href = href;
        return;
      }
      el.innerHTML = '<div class="error">Nenhuma página neste módulo</div>';
      return;
    }
    el.innerHTML = apps.map(a => {
      const href = resolveHref(a);
      return cardHtml(a, {
        href,
        hint: href ? "Abrir" : "Em breve"
      });
    }).join("");
  }

  function openModuleById(id) {
    const mod = menuData.find(m => m.id === id);
    if (!mod) return renderModules();
    const apps = moduleApps(mod);
    if (apps.length > 1) renderApps(mod);
    else {
      const href = resolveHref(apps[0]) || resolveHref(mod);
      if (href) location.href = href;
      else renderModules();
    }
  }

  document.getElementById("cards").addEventListener("click", (e) => {
    const card = e.target.closest("[data-module]");
    if (!card) return;
    e.preventDefault();
    openModuleById(card.getAttribute("data-module"));
  });

  document.getElementById("hub-back").addEventListener("click", () => renderModules());

  document.getElementById("btn-logout").addEventListener("click", () => {
    fetch("/api/auth/logout", { method: "POST", headers: { "X-Auth-Token": token } }).catch(() => {});
    localStorage.removeItem("auth_token");
    localStorage.removeItem("user_data");
    localStorage.removeItem("current_empresa_id");
    location.href = "index.html";
  });

  (async function boot() {
    await validate();
    document.getElementById("user-name").textContent = user.nome || user.usuario || "Usuário";
    document.getElementById("user-role").textContent = user.role || "operador";
    greet(user.nome || user.usuario);

    // Marca dinâmica — identidade da organização em vez de BECRP fixo
    try {
      const r = await fetch("/api/organizacao/nome", { headers: { "X-Auth-Token": token } });
      if (r.ok) {
        const data = await r.json();
        if (data && data.status === "ok") {
          const nome = data.empresa || data.organizacao || "BECRP";
          const h1 = document.querySelector(".brand h1");
          if (h1) h1.textContent = nome;
        }
      }
    } catch (_) {}

    try {
      const svg = await (await fetch("img/icons.svg")).text();
      const wrap = document.createElement("div");
      wrap.style.display = "none";
      wrap.innerHTML = svg;
      document.body.prepend(wrap);
    } catch (_) {}

    try {
      menuData = await (await fetch("assets/data/menu.json")).json();
      const hash = (location.hash || "").replace(/^#/, "");
      const modId = hash.startsWith("mod=") ? decodeURIComponent(hash.slice(4)) : "";
      if (modId) openModuleById(modId);
      else renderModules();
    } catch (e) {
      document.getElementById("cards").innerHTML = '<div class="error">Falha ao carregar o menu</div>';
    }
  })();
})();
</script>
</body>
</html>
