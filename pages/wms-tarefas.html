<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BECRP — WMS Tarefas</title>
  <meta name="theme-color" content="#714B67">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/variaveis.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/icons.css">
  <link rel="stylesheet" href="../css/grid.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/motion.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .pc-toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:end; }
    .pc-toolbar .field { margin:0; min-width:110px; }
    .pc-toolbar .grow { flex:1; min-width:160px; }
    .pc-msg { margin:8px 0; font-size:14px; }
    .pc-msg.err { color:#f87171; }
    .pc-msg.ok { color:#4ade80; }
    .pc-meta { font-size:13px; opacity:.7; margin-bottom:10px; }
    .pc-form { display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:10px; margin:0 0 16px; padding:14px; border:1px solid rgba(255,255,255,.1); border-radius:8px; }
    .pc-form .field { margin:0; }
    .pc-form .span2 { grid-column: span 2; }
    .pc-form .actions { display:flex; gap:8px; flex-wrap:wrap; grid-column:1/-1; }
    .pc-table { width:100%; border-collapse:collapse; }
    .pc-table th, .pc-table td { padding:8px 10px; border-bottom:1px solid rgba(255,255,255,.08); text-align:left; font-size:13px; vertical-align:top; }
    .pc-table th { font-size:11px; text-transform:uppercase; opacity:.7; }
    .badge-sa { font-size:11px; padding:2px 6px; border-radius:4px; border:1px solid rgba(255,255,255,.15); white-space:nowrap; }
    .pc-note { font-size:12px; opacity:.65; margin:0 0 10px; }
    .sub { font-size:12px; opacity:.75; }
    .act-btns { display:flex; flex-wrap:wrap; gap:4px; }
  </style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-brand" onclick="location='../index4.html'" style="cursor:pointer">
      <svg class="icon"><use href="../assets/images/icons.svg#icon-building"/></svg>
      <span class="brand-text">BECRP</span>
    </div>
    <nav class="sidebar-nav">
            <a class="menu-item" href="wms-workspace.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-home"/></svg><span class="menu-label">Workspace</span></a>
      <a class="menu-item" href="wms-analytics.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-file-text"/></svg><span class="menu-label">Analytics</span></a>
      <a class="menu-item" href="wms-armazens.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-building"/></svg><span class="menu-label">Armazéns</span></a>
      <a class="menu-item" href="wms-localizacoes.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-box"/></svg><span class="menu-label">Localizações</span></a>
      <a class="menu-item" href="wms-operacoes.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-truck"/></svg><span class="menu-label">Operações</span></a>
      <a class="menu-item active" href="wms-tarefas.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-file-text"/></svg><span class="menu-label">Tarefas</span></a>
      <a class="menu-item" href="wms-picking.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-cart"/></svg><span class="menu-label">Picking</span></a>
      <a class="menu-item" href="wms-contagem.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-box"/></svg><span class="menu-label">Contagem</span></a>
      <a class="menu-item" href="wms-recebimento.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-truck"/></svg><span class="menu-label">Recebimento</span></a>
      <a class="menu-item" href="wms-expedicao.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-truck"/></svg><span class="menu-label">Expedição</span></a>
      <a class="menu-item" href="estoque.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-box"/></svg><span class="menu-label">Estoque</span></a>
      <a class="menu-item" href="../index4.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-home"/></svg><span class="menu-label">Dashboard</span></a>
    </nav>
  </aside>
  <main id="main">
    <div class="page-header">
      <h1>WMS Tarefas</h1>
    </div>
    <div class="pc-form no-print" id="form-box">
      <div class="field"><label>Tipo</label><select id="f-tipo" class="input"></select></div>
      <div class="field"><label>Armazém</label><input id="f-armazem" class="input" placeholder="DC-01"></div>
      <div class="field"><label>Operação (id, opcional)</label><input id="f-op" class="input"></div>
      <div class="field"><label>Prioridade</label><select id="f-prioridade" class="input"></select></div>
      <div class="field"><label>Loc. origem</label><input id="f-origem" class="input"></div>
      <div class="field"><label>Loc. destino</label><input id="f-destino" class="input"></div>
      <div class="field"><label>Produto</label><input id="f-produto" class="input"></div>
      <div class="field"><label>Qtd</label><input id="f-qtd" type="number" step="0.001" class="input"></div>
      <div class="actions"><button class="btn" onclick="criar()">Criar tarefa</button></div>
    </div>
    <div class="pc-toolbar no-print">
      <div class="field grow"><input id="q" type="text" placeholder="buscar..." class="input"></div>
      <div class="field"><select id="status" class="input"><option value="">Status</option></select></div>
      <div class="field"><select id="tipo" class="input"><option value="">Tipo</option></select></div>
      <div class="field"><input id="operador" class="input" placeholder="operador"></div>
      <button class="btn" onclick="load()">Filtrar</button>
    </div>
    <div id="msg" class="pc-msg no-print"></div>
    <div class="pc-meta" id="meta"></div>
    <table class="pc-table">
      <thead><tr><th>ID</th><th>Tipo</th><th>Operação</th><th>Armazém</th><th>Origem → Destino</th><th>Operador</th><th>Prioridade</th><th>Status</th><th class="no-print">Ações</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <div id="detail" class="detail"></div>

  </main>
</div>

<script>
const API = window.location.origin + '/api';
const token = localStorage.getItem('auth_token') || '';
let PERM = { pode_escrever: false, pode_excluir: false, role: '' };

async function api(path, method='GET', body) {
  const opts = { method, headers: { 'X-Auth-Token': token, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  return r.json();
}

function msg(txt, err) {
  const el = document.getElementById('msg');
  el.textContent = txt || '';
  el.className = 'pc-msg ' + (err ? 'err' : 'ok');
}

function optMap(id, map, firstLabel) {
  const sel = document.getElementById(id);
  if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = '<option value="">' + (firstLabel || '—') + '</option>' +
    Object.entries(map || {}).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  if (cur) sel.value = cur;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}


async function load() {
  const q = document.getElementById('q').value;
  const status = document.getElementById('status').value;
  const tipo = document.getElementById('tipo').value;
  const operador = document.getElementById('operador').value.trim();
  const qs = new URLSearchParams();
  if (q) qs.set('q', q);
  if (status) qs.set('status', status);
  if (tipo) qs.set('tipo', tipo);
  if (operador) qs.set('operador', operador);
  const r = await api('/wms/tarefas?' + qs.toString());
  if (r.status !== 'ok') return msg(r.message, true);
  PERM = r.permissoes || PERM;
  document.getElementById('form-box').style.display = PERM.pode_escrever ? '' : 'none';
  optMap('status', r.status_opcoes, 'Status');
  optMap('tipo', r.tipos, 'Tipo');
  optMap('f-tipo', r.tipos, 'Selecione…');
  optMap('f-prioridade', r.prioridades, 'Selecione…');
  document.getElementById('meta').textContent = `Filtrado: ${r.filtrado || 0} / Total: ${r.total || 0}`;
  document.getElementById('tb').innerHTML = (r.tarefas || []).map(t => `<tr>
    <td><a href="#" onclick="openTf('${esc(t.id)}'); return false">${esc(t.id)}</a></td>
    <td>${esc(t.tipo_label || t.tipo)}</td>
    <td>${esc(t.operacao_id || '—')}</td><td>${esc(t.armazem)}</td>
    <td>${esc(t.loc_origem || '—')} → ${esc(t.loc_destino || '—')}</td>
    <td>${esc(t.operador || '—')}</td>
    <td>${esc(t.prioridade_label || t.prioridade)}</td>
    <td><span class="badge-sa">${esc(t.status_label || t.status)}</span></td>
    <td class="act-btns no-print">
      ${(t.acoes || []).map(a => `<button class="btn btn-sm" onclick="act('${esc(t.id)}','${a}')">${a}</button>`).join('')}
    </td>
  </tr>`).join('');
}

async function openTf(id) {
  const r = await api('/wms/tarefas/' + encodeURIComponent(id));
  if (r.status !== 'ok') return msg(r.message, true);
  const t = r.tarefa;
  document.getElementById('detail').innerHTML = `<h3>${esc(t.id)} <span class="badge-sa">${esc(t.status_label || t.status)}</span></h3>
    <p>${esc(t.tipo_label || t.tipo)} · ${esc(t.armazem)} · ${esc(t.loc_origem || '—')} → ${esc(t.loc_destino || '—')} ·
       Operador: ${esc(t.operador || '—')} · Operação: ${esc(t.operacao_id || '—')}</p>
    ${t.observacao ? '<p>' + esc(t.observacao) + '</p>' : ''}
    <div class="act-btns" style="margin-top:10px">
      ${(t.acoes || []).map(a => `<button class="btn" onclick="act('${esc(t.id)}','${a}')">${a}</button>`).join('')}
    </div>`;
}

async function criar() {
  const body = {
    tipo: document.getElementById('f-tipo').value,
    armazem: document.getElementById('f-armazem').value.trim().toUpperCase(),
    operacao_id: document.getElementById('f-op').value.trim().toUpperCase(),
    prioridade: document.getElementById('f-prioridade').value,
    loc_origem: document.getElementById('f-origem').value.trim().toUpperCase(),
    loc_destino: document.getElementById('f-destino').value.trim().toUpperCase(),
    produto_id: document.getElementById('f-produto').value.trim(),
    qtd: document.getElementById('f-qtd').value,
  };
  const r = await api('/admin/wms/tarefas', 'POST', body);
  if (r.status !== 'ok') return msg(r.message, true);
  msg('Tarefa ' + r.tarefa.id + ' criada');
  openTf(r.tarefa.id); load();
}

async function act(id, action) {
  let extra = {};
  if (action === 'assign') {
    const op = prompt('Operador:') || '';
    if (!op) return;
    extra.operador = op;
  }
  if (action === 'cancel') {
    const motivo = prompt('Motivo:') || '';
    if (!motivo) return;
    extra.motivo = motivo;
  }
  const r = await api('/admin/wms/tarefas/' + encodeURIComponent(id), 'POST', { action, ...extra });
  if (r.status !== 'ok') return msg(r.message, true);
  msg('Ação ' + action + ' ok');
  openTf(id); load();
}

(async function init() { load(); })();

</script>
<script src="../js/brand.js"></script>
</body>
</html>
