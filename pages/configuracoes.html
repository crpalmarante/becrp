<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BECRP — Configurações</title>
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/variaveis.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/icons.css">
<link rel="stylesheet" href="../css/grid.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/motion.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/style.css">
<style>
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--border-color);margin-bottom:16px}
.tabs button{background:transparent;border:none;color:var(--text-muted);padding:10px 16px;cursor:pointer;font-weight:600}
.tabs button.active{color:#5eead4;border-bottom:2px solid #5eead4}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px}
.so-btn{border:1px solid var(--border-color);background:var(--surface-panel);color:var(--text-primary);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13px}
.so-btn.primary{background:rgba(20,184,166,.16);border-color:rgba(20,184,166,.45);color:#99f6e4}
.msg{padding:10px;border-radius:6px;margin-top:12px;font-size:13px}
.msg.ok{background:rgba(34,197,94,.12);color:#86efac}
.msg.err{background:rgba(239,68,68,.12);color:#fca5a5}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-brand" onclick="location='../index4.html'" style="cursor:pointer"><svg class="icon"><use href="../assets/images/icons.svg#icon-building"/></svg><span class="brand-text">BECRP</span></div>
    <nav class="sidebar-nav">
      <a class="menu-item" href="estoque.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-box"/></svg><span class="menu-label">Estoque</span></a>
      <a class="menu-item" href="compras.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-box"/></svg><span class="menu-label">Compras</span></a>
      <a class="menu-item active" href="configuracoes.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-settings"/></svg><span class="menu-label">Configurações</span></a>
      <a class="menu-item" href="vendas.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-dollar"/></svg><span class="menu-label">Vendas</span></a>
      <a class="menu-item" href="../index4.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-home"/></svg><span class="menu-label">Dashboard</span></a>
    </nav>
  </aside>
  <div class="main-area">
    <header class="topbar"><div class="topbar-brand"><span class="topbar-title">Configurações</span></div>
      <div class="topbar-user" style="margin-left:auto;display:flex;align-items:center;gap:12px">
        <span class="topbar-user-info"><span id="user-name-display">—</span></span>
        <button class="topbar-icon-btn" data-logout title="Sair">Sair</button>
      </div>
    </header>
    <div class="main-content" style="padding:var(--space-5)">
      <div class="tabs" id="tabs"></div>
      <div id="form-area"></div>
      <div class="so-actions" style="margin-top:16px">
        <button type="button" class="so-btn primary" id="btn-salvar">Salvar</button>
        <button type="button" class="so-btn" id="btn-reset">Restaurar padrão</button>
      </div>
      <div id="msg"></div>
    </div>
    <div class="status-bar" style="border-radius:0 0 var(--radius-panel) var(--radius-panel)">
      <div class="status-bar-left"><span id="status-user-info">Usuário: —</span></div>
      <div class="status-bar-right"><span>Configurações · BECRP v1.0</span></div>
    </div>
  </div>
</div>
<script src="../js/services/AuthService.js"></script>
<script src="../js/auth/page-boot.js"></script>
<script>
(function(){
  const API = "/api/settings";
  let modulos = [];
  let settings = {};
  let current = "geral";

  async function api(path, opts={}){
    const token = AuthService.getToken();
    const res = await fetch(path, {method: opts.method||"GET", headers: Object.assign({"X-Auth-Token": token, "Content-Type": "application/json"}, opts.headers||{}), body: opts.body});
    return res.json();
  }

  const FIELD_LABELS = {
    empresa_nome: "Nome da empresa",
    moeda: "Moeda",
    idioma: "Idioma",
    fuso_horario: "Fuso horário",
    casas_decimais_valor: "Casas decimais de valor",
    casas_decimais_qtd: "Casas decimais de quantidade",
    aprovacao_limite_direto: "Limite de aprovação direta (R$)",
    aprovacao_roles: "Roles permitidas para aprovar",
    status_inicial_pedido: "Status inicial do pedido",
    requer_aprovacao: "Requer aprovação",
    permitir_pedido_sem_aprovacao: "Permitir pedido sem aprovação",
    bloquear_edicao_pedido_enviado: "Bloquear edição de pedido enviado",
    bloquear_edicao_pedido_recebido: "Bloquear edição de pedido recebido",
    comprador_padrao: "Comprador padrão",
    condicao_pg_padrao: "Condição de pagamento padrão",
    forma_pg_padrao: "Forma de pagamento padrão",
    unidade_padrao: "Unidade padrão",
    dias_previsao_padrao: "Dias de previsão de entrega padrão",
    email_notificacao_aprovacao: "E-mail para notificação de aprovação",
    numero_itens_por_pedido: "Limite de itens por pedido (0 = ilimitado)",
    ambiente_sefaz: "Ambiente SEFAZ",
    serie_nfe: "Série NF-e",
    serie_nfce: "Série NFC-e",
    regime_tributario: "Regime tributário",
    controle_lote: "Controle de lote",
    controle_serie: "Controle de série",
    estoque_negativo: "Permitir estoque negativo",
    pedido_precisa_aprovacao: "Pedido de venda precisa aprovação",
    limite_credito_auto: "Limite de crédito automático",
  };

  function renderTabs(){
    const box = document.getElementById("tabs");
    box.innerHTML = modulos.map(m=>`
      <button class="${m===current?'active':''}" data-mod="${m}">${escapeHtml(m.charAt(0).toUpperCase()+m.slice(1))}</button>
    `).join("");
    box.querySelectorAll("button[data-mod]").forEach(b=>{
      b.onclick = ()=>{ current=b.dataset.mod; renderTabs(); renderForm(); };
    });
  }

  function renderForm(){
    const cfg = settings.modulos[current] || {};
    const box = document.getElementById("form-area");
    box.innerHTML = `<div class="form-grid">${Object.entries(cfg).map(([k,v])=>{
      const id = `cfg-${k}`;
      if(typeof v === "boolean"){
        return `<div><label><input type="checkbox" id="${id}" ${v?'checked':''}> ${escapeHtml(FIELD_LABELS[k]||k)}</label></div>`;
      }
      if(typeof v === "number"){
        return `<div><label>${escapeHtml(FIELD_LABELS[k]||k)}<input class="form-input" id="${id}" type="number" step="${String(v).includes('.')?0.01:1}" value="${v}"></label></div>`;
      }
      if(Array.isArray(v)){
        return `<div><label>${escapeHtml(FIELD_LABELS[k]||k)}<input class="form-input" id="${id}" value="${escapeHtml(v.join(", "))}"></label></div>`;
      }
      return `<div><label>${escapeHtml(FIELD_LABELS[k]||k)}<input class="form-input" id="${id}" value="${escapeHtml(v||"")}"></label></div>`;
    }).join("")}</div>`;
  }

  async function load(){
    const res = await api(API);
    if(res.status !== "ok") return alert(res.message || "Erro");
    modulos = res.modulos || [];
    settings = res.settings || {modulos:{}};
    if(!modulos.includes(current)) current = modulos[0] || "geral";
    renderTabs();
    renderForm();
  }

  async function salvar(){
    const cfg = settings.modulos[current] || {};
    const valores = {};
    for(const k of Object.keys(cfg)){
      const el = document.getElementById(`cfg-${k}`);
      if(!el) continue;
      const original = cfg[k];
      if(typeof original === "boolean"){
        valores[k] = el.checked;
      } else if(typeof original === "number"){
        valores[k] = Number(el.value);
      } else if(Array.isArray(original)){
        valores[k] = el.value.split(",").map(s=>s.trim()).filter(Boolean);
      } else {
        valores[k] = el.value;
      }
    }
    const res = await api(API, {method:"POST", body: JSON.stringify({modulo: current, valores})});
    const msg = document.getElementById("msg");
    if(res.status !== "ok"){ msg.textContent = res.message || "Erro"; msg.className = "msg err"; return; }
    msg.textContent = "Configurações salvas"; msg.className = "msg ok";
    await load();
  }

  async function resetar(){
    if(!confirm("Restaurar padrões do módulo " + current + "?")) return;
    const res = await api(API + "/" + current, {method:"DELETE"});
    const msg = document.getElementById("msg");
    if(res.status !== "ok"){ msg.textContent = res.message || "Erro"; msg.className = "msg err"; return; }
    msg.textContent = "Padrão restaurado"; msg.className = "msg ok";
    await load();
  }

  document.getElementById("btn-salvar").onclick = salvar;
  document.getElementById("btn-reset").onclick = resetar;

  load();
})();
</script>
</body>
</html>
