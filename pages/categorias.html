</head>

<div id="app">

        </div>
        <nav class="sidebar-nav">
            <a class="menu-item" href="configuracoes.html">
                <svg class="icon"><use href="../assets/images/icons.svg#icon-settings"/></svg>
                <span class="menu-label">Configurações</span>
            </a>
            <a class="menu-item" href="categorias.html">
                <svg class="icon"><use href="../assets/images/icons.svg#icon-filter"/></svg>
                <span class="menu-label">Categorias</span>
            </a>
            <a class="menu-item" href="produtos.html">
                <svg class="icon"><use href="../assets/images/icons.svg#icon-box"/></svg>
                <span class="menu-label">Produtos</span>
            </a>
            <a class="menu-item" href="fornecedores.html">
                <svg class="icon"><use href="../assets/images/icons.svg#icon-truck"/></svg>
                <span class="menu-label">Fornecedores</span>
            </a>
            <a class="menu-item" href="contatos.html">
                <svg class="icon"><use href="../assets/images/icons.svg#icon-users"/></svg>
                <span class="menu-label">Contatos</span>
            </a>
            <a class="menu-item" href="../index4.html">
                <svg class="icon"><use href="../assets/images/icons.svg#icon-home"/></svg>
                <span class="menu-label">Dashboard</span>
            </a>
        </nav>
    </aside>

    <div class="main-area">
        <header class="topbar">
            <div class="topbar-brand">
                <svg class="icon"><use href="../assets/images/icons.svg#icon-building"/></svg>
                <span class="topbar-title">Categorias</span>
            </div>
            <div class="topbar-search">
                <svg class="icon"><use href="../assets/images/icons.svg#icon-search"/></svg>
                <input class="topbar-search-input" id="search-input" placeholder="Buscar categorias...">
            </div>
            <div class="topbar-user" style="margin-left:auto">
                <button type="button" class="so-btn primary" onclick="openModal()" title="Nova categoria">
                    <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13H13v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></span>Novo
                </button>
                <span class="topbar-user-info">
                    <span id="user-name-display">Administrador</span>
                </span>
            </div>
        </header>

        <div class="workspace">
            <div id="workspace-view" style="display:flex">
                <div class="workspace-header">
                    <h2 class="workspace-title">Gerenciar Categorias</h2>
                </div>
                <div class="workspace-content">
                    <div id="data-container"></div>
                </div>
                <div class="status-bar" style="border-radius:0 0 var(--radius-panel) var(--radius-panel)">
                    <div class="status-bar-left">
                        <span id="status-user-info">Usuário: Administrador</span>
                    </div>
                    <div class="status-bar-right">
                        <span>Versão 1.0.0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="dialog-overlay" id="item-modal">
    <div class="dialog-box">
        <div class="dialog-header">
            <h3 class="dialog-title" id="modal-title">Nova Categoria</h3>
            <button class="dialog-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="dialog-body">
            <form id="item-form">
                <div class="field">
                    <label>Nome</label>
                    <input class="form-input" id="edit-nome" required>
                </div>
                <div class="field">
                    <label>Categoria pai (opcional)</label>
                    <select class="form-input" id="edit-pai">
                        <option value="">— Sem categoria pai —</option>
                    </select>
                </div>
                <div class="field">
                    <label>Descrição</label>
                    <textarea class="form-input" id="edit-descricao" rows="3"></textarea>
                </div>
                <div class="form-error" id="form-error"></div>
            </form>
        </div>
        <div class="dialog-footer">
            <button class="dialog-btn dialog-btn-secondary" onclick="closeModal()">Cancelar</button>
            <button class="dialog-btn dialog-btn-primary" onclick="save()">Salvar</button>
        </div>
    </div>
</div>

<style>
    textarea.form-input{resize:vertical;min-height:60px;font-family:inherit}
    .so-btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      border:1px solid var(--border-color);background:var(--surface-panel);
      color:var(--text-primary);padding:0 12px;height:34px;line-height:1;
      border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;
    }
    .so-btn .icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px}
    .so-btn .icon svg{width:18px;height:18px;fill:currentColor}
    .so-btn.primary{background:rgba(20,184,166,.2);border-color:rgba(20,184,166,.45);color:#5eead4}
    /* Ações na mesma linha e linhas mais finas */
    .dg-table td.dg-cell{padding-top:3px;padding-bottom:3px}
    .dg-table .dg-page{width:26px;height:26px;font-size:12px}
</style>
<script src="../js/services/AuthService.js"></script>
<script src="../js/auth/page-boot.js"></script>
<script src="../js/brand.js"></script>
<script>
    let editingId = null;
    let allData = [];
    function escapeHtml(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    // Constrói a árvore e devolve lista ordenada com nível de profundidade
    function buildTree(list) {
        const byId = new Map(list.map(c => [String(c.id), c]));
        const children = new Map();
        list.forEach(c => {
            const pid = String(c.pai_id || 0);
            if (!children.has(pid)) children.set(pid, []);
            children.get(pid).push(c);
        });
        const out = [];
        const walk = (pid, level) => {
            const kids = (children.get(String(pid)) || []).sort((a, b) => String(a.nome).localeCompare(String(b.nome)));
            kids.forEach(c => { out.push({ ...c, _level: level }); walk(c.id, level + 1); });
        };
        walk(0, 0);
        return out;
    }
async function load() {
        const container = document.getElementById("data-container");
        container.innerHTML = '<div class="glass-panel" style="text-align:center;padding:3rem">Carregando...</div>';
        const data = await window.api("/api/admin/categorias");
        if (data.status !== "ok") {
            container.innerHTML = '<div class="glass-panel" style="text-align:center;padding:3rem;color:var(--color-danger)">Acesso negado</div>';
            return;
        }
        allData = data.categorias || [];
        render();
    }

    function categoriaNome(id) {
        const c = allData.find(x => String(x.id) === String(id));
        return c ? c.nome : "";
    }

    function render() {
        const q = (document.getElementById("search-input").value || "").toLowerCase();
        const tree = buildTree(allData);
        const filtered = q ? tree.filter(e => e.nome.toLowerCase().includes(q)) : tree;
        const nomePai = (e) => {
            const pid = e.pai_id || 0;
            const nome = categoriaNome(pid);
            return pid && nome ? ` <span style="color:var(--text-muted);font-size:11px">(de ${escapeHtml(nome)})</span>` : "";
        };

        document.getElementById("data-container").innerHTML = `
            <div class="dg-wrapper">
                <div class="dg-scroll">
                    <table class="dg-table">
                        <thead><tr class="dg-header">
                            <th class="dg-th" style="width:40px"><div class="dg-th-content">#</div></th>
                            <th class="dg-th"><div class="dg-th-content">Nome</div></th>
                            <th class="dg-th"><div class="dg-th-content">Descrição</div></th>
                            <th class="dg-th"><div class="dg-th-content">Status</div></th>
                            <th class="dg-th" style="width:100px"><div class="dg-th-content">Ações</div></th>
                        </tr></thead>
                        <tbody>
                            ${filtered.map(e => `
                            <tr class="dg-row" style="${e.ativo===false?'opacity:.5':''}">
                                <td class="dg-cell dg-cell-center">${String(e.id).substring(0,6)}</td>
                                <td class="dg-cell"><span style="display:inline-block;width:${e._level*16}px"></span>${e._level>0?'└ ':'<strong>'}${escapeHtml(e.nome)}${e._level>0?'':''}</strong>${nomePai(e)}</td>
                                <td class="dg-cell">${escapeHtml(e.descricao)||'-'}</td>
                                <td class="dg-cell"><span class="badge badge-${e.ativo!==false?'success':'danger'}">${e.ativo!==false?'Ativo':'Inativo'}</span></td>
                                <td class="dg-cell">
                                    <span style="display:inline-flex;gap:2px;align-items:center">
                                        <button class="dg-page" onclick='edit(${JSON.stringify(e).replace(/'/g,"&#39;")})' title="Editar">✎</button>
                                        <button class="dg-page" onclick="toggle('${e.id}')" title="${e.ativo!==false?'Desativar':'Ativar'}">${e.ativo!==false?'⏸':'▶'}</button>
                                    </span>
                                </td>
                            </tr>`).join('')}
                            ${filtered.length===0?'<tr><td class="dg-cell" colspan="5" style="text-align:center;padding:2rem">Nenhuma categoria cadastrada</td></tr>':''}
                        </tbody>
                    </table>
                </div>
                <div style="padding:var(--space-4);text-align:center;color:var(--text-secondary);font-size:var(--font-sm)">
                    ${filtered.length} categoria${filtered.length!==1?'s':''} cadastrada${filtered.length!==1?'s':''}
                </div>
            </div>
        `;
    }

    function fillPaiOptions(selectedId) {
        const sel = document.getElementById("edit-pai");
        if (!sel) return;
        // Árvore: exibe apenas categorias que não são descendentes da que está sendo editada
        const blocked = new Set();
        if (editingId != null) {
            const visit = (id) => {
                blocked.add(String(id));
                allData.filter(c => String(c.pai_id || 0) === String(id)).forEach(c => visit(c.id));
            };
            visit(editingId);
        }
        const list = allData.filter(c => !blocked.has(String(c.id)));
        sel.innerHTML = '<option value="">— Sem categoria pai —</option>' +
            list.map(c => `<option value="${c.id}">${escapeHtml(c.nome)}</option>`).join("");
        sel.value = selectedId != null ? String(selectedId) : "";
    }

    function edit(data) {
        editingId = data.id;
        document.getElementById("modal-title").textContent = "Editar Categoria";
        document.getElementById("edit-nome").value = data.nome||"";
        document.getElementById("edit-descricao").value = data.descricao||"";
        document.getElementById("form-error").classList.remove("visible");
        fillPaiOptions(data.pai_id || 0);
        document.getElementById("item-modal").classList.add("dialog-open");
    }

    function openModal() {
        editingId = null;
        document.getElementById("modal-title").textContent = "Nova Categoria";
        document.getElementById("edit-nome").value = "";
        document.getElementById("edit-descricao").value = "";
        document.getElementById("form-error").classList.remove("visible");
        fillPaiOptions(0);
        document.getElementById("item-modal").classList.add("dialog-open");
    }

    function closeModal() {
        document.getElementById("item-modal").classList.remove("dialog-open");
        editingId = null;
    }

    async function save() {
        const nome = document.getElementById("edit-nome").value.trim();
        const descricao = document.getElementById("edit-descricao").value.trim();
        const errEl = document.getElementById("form-error");
        errEl.classList.remove("visible");

        if (!nome) { errEl.textContent = "Nome é obrigatório"; errEl.classList.add("visible"); return; }

        const pai = document.getElementById("edit-pai").value || "";
        const payload = { nome, descricao };
        if (pai) payload.pai_id = Number(pai);

        let data;
        if (editingId) {
            data = await window.api("/api/admin/categorias/"+editingId, {
                method: "POST",
                body: JSON.stringify({ action: "update", ...payload })
            });
        } else {
            data = await window.api("/api/admin/categorias", {
                method: "POST",
                body: JSON.stringify(payload)
            });
        }

        if (data.status !== "ok") {
            errEl.textContent = data.message || "Erro ao salvar";
            errEl.classList.add("visible");
            return;
        }
        closeModal();
        load();
    }

    async function toggle(id) {
        await window.api("/api/admin/categorias/"+id, {
            method: "POST",
            body: JSON.stringify({ action: "toggle" })
        });
        load();
    }

    document.addEventListener("auth:ready", function () {
        load();
        document.getElementById("search-input").addEventListener("input", render);
        });
</script>

</body>
</html>
