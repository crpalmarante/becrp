<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BECRP — Tabela de Preços de Fornecedores</title>
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/variaveis.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/icons.css">
<link rel="stylesheet" href="../css/grid.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/motion.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/style.css">
<style>
.view{display:none}.view.active{display:block}
.table-wrap{overflow:auto;border:1px solid var(--border-color);border-radius:var(--radius-panel)}
table.data{width:100%;border-collapse:collapse;font-size:var(--font-sm)}
table.data th{text-align:left;padding:10px 12px;background:rgba(255,255,255,.04);color:var(--text-muted);font-weight:600;border-bottom:1px solid var(--border-color);white-space:nowrap}
table.data td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
table.data tr:hover td{background:rgba(255,255,255,.03)}
table.data tr{cursor:pointer}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(20,184,166,.15);color:#5eead4}
.money{font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:var(--space-4)}
.tab-btn{border:1px solid var(--border-color);background:var(--surface-panel);color:var(--text-secondary);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:var(--font-sm);font-weight:600}
.so-btn{border:1px solid var(--border-color);background:var(--surface-panel);color:var(--text-primary);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13px}
.so-btn.primary{background:rgba(20,184,166,.16);border-color:rgba(20,184,166,.45);color:#99f6e4}
.so-btn.danger{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.45);color:#fca5a5}
.empty{text-align:center;padding:3rem;color:var(--text-muted)}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--border-color);margin-bottom:16px}
.tabs button{background:transparent;border:none;color:var(--text-muted);padding:10px 16px;cursor:pointer;font-weight:600}
.tabs button.active{color:#5eead4;border-bottom:2px solid #5eead4}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-brand" onclick="location='../index4.html'" style="cursor:pointer"><svg class="icon"><use href="../assets/images/icons.svg#icon-building"/></svg><span class="brand-text">BECRP</span></div>
    <nav class="sidebar-nav">
      <a class="menu-item" href="estoque.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-box"/></svg><span class="menu-label">Estoque</span></a>
      <a class="menu-item" href="compras.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-box"/></svg><span class="menu-label">Compras</span></a>
      <a class="menu-item active" href="vendor-pricelist.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-dollar"/></svg><span class="menu-label">Pricelists</span></a>
      <a class="menu-item" href="configuracoes.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-settings"/></svg><span class="menu-label">Configurações</span></a>
      <a class="menu-item" href="vendas.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-dollar"/></svg><span class="menu-label">Vendas</span></a>
      <a class="menu-item" href="../index4.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-home"/></svg><span class="menu-label">Dashboard</span></a>
    </nav>
  </aside>
  <div class="main-area">
    <header class="topbar"><div class="topbar-brand"><span class="topbar-title">Tabela de Preços de Fornecedores</span></div>
      <div class="topbar-user" style="margin-left:auto;display:flex;align-items:center;gap:12px">
        <span class="topbar-user-info"><span id="user-name-display">—</span></span>
        <button class="topbar-icon-btn" data-logout title="Sair">Sair</button>
      </div>
    </header>
    <div class="main-content" style="padding:var(--space-5)">
      <div class="tabs">
        <button class="active" id="tab-list">Pricelists</button>
        <button id="tab-novo">Novo</button>
      </div>
      <div class="view active" id="view-list">
        <div class="toolbar">
          <input class="form-input" id="q-prod" placeholder="Produto" style="max-width:180px">
          <input class="form-input" id="q-forn" placeholder="Fornecedor" style="max-width:180px">
          <button type="button" class="tab-btn" id="btn-refresh">Atualizar</button>
          <a class="so-btn" href="compras.html">Compras</a>
        </div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Produto</th><th>Fornecedor</th><th>Código Forn.</th><th>Preço</th><th>Moeda</th><th>Lead Time</th><th>Qtd Mín.</th><th>Válido até</th></tr></thead>
            <tbody id="tbody"><tr><td colspan="8" class="empty">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="view" id="view-form">
        <h2 id="form-title">Nova Pricelist</h2>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0">
          <label style="font-size:12px;color:var(--text-muted)">Produto ID<input class="form-input" id="f-prod-id"></label>
          <label style="font-size:12px;color:var(--text-muted)">Produto<input class="form-input" id="f-prod"></label>
          <label style="font-size:12px;color:var(--text-muted)">Fornecedor ID<input class="form-input" id="f-forn-id"></label>
          <label style="font-size:12px;color:var(--text-muted)">Fornecedor<input class="form-input" id="f-forn"></label>
          <label style="font-size:12px;color:var(--text-muted)">Código Fornecedor<input class="form-input" id="f-cod-forn"></label>
          <label style="font-size:12px;color:var(--text-muted)">Preço<input class="form-input" id="f-preco" type="number" step="0.01"></label>
          <label style="font-size:12px;color:var(--text-muted)">Moeda<input class="form-input" id="f-moeda" value="BRL"></label>
          <label style="font-size:12px;color:var(--text-muted)">Lead Time (dias)<input class="form-input" id="f-lead" type="number" value="0"></label>
          <label style="font-size:12px;color:var(--text-muted)">Qtd Mínima<input class="form-input" id="f-qtd-min" type="number" step="0.001" value="0"></label>
          <label style="font-size:12px;color:var(--text-muted)">Válido de<input class="form-input" id="f-de" type="date"></label>
          <label style="font-size:12px;color:var(--text-muted)">Válido até<input class="form-input" id="f-ate" type="date"></label>
        </div>
        <div class="so-actions">
          <button type="button" class="so-btn primary" id="btn-salvar">Salvar</button>
          <button type="button" class="so-btn" id="btn-voltar">Voltar</button>
        </div>
        <div id="form-msg" style="margin-top:12px"></div>
      </div>
    </div>
    <div class="status-bar" style="border-radius:0 0 var(--radius-panel) var(--radius-panel)">
      <div class="status-bar-left"><span id="status-user-info">Usuário: —</span></div>
      <div class="status-bar-right"><span>Vendor Pricelists · BECRP v1.0</span></div>
    </div>
  </div>
</div>
<script src="../js/services/AuthService.js"></script>
<script src="../js/auth/page-boot.js"></script>
<script>
(function(){
  const API = "/api/vendor-pricelist";
  const money = n => (Number(n)||0).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
  const escapeHtml = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  let current = null;

  async function api(path, opts={}){
    const token = AuthService.getToken();
    const res = await fetch(path, {method: opts.method||"GET", headers: Object.assign({"X-Auth-Token": token, "Content-Type": "application/json"}, opts.headers||{}), body: opts.body});
    return res.json();
  }
  function showView(id){ document.querySelectorAll(".view").forEach(v=>v.classList.remove("active")); document.getElementById("view-"+id).classList.add("active"); }

  async function load(){
    const qs = new URLSearchParams();
    const prod = document.getElementById("q-prod").value.trim(); if(prod) qs.set("produto_id", prod);
    const forn = document.getElementById("q-forn").value.trim(); if(forn) qs.set("fornecedor_id", forn);
    const res = await api(API + (qs.toString()?"?"+qs:""));
    const rows = res.pricelists || [];
    const tbody = document.getElementById("tbody");
    if(!rows.length){ tbody.innerHTML = '<tr><td colspan="8" class="empty">Nenhuma pricelist</td></tr>'; return; }
    tbody.innerHTML = rows.map(r=>`
      <tr data-id="${r.id}">
        <td>${escapeHtml(r.produto||r.produto_id||"—")}</td>
        <td>${escapeHtml(r.fornecedor||r.fornecedor_id||"—")}</td>
        <td>${escapeHtml(r.codigo_fornecedor||"—")}</td>
        <td class="money">${money(r.preco)}</td>
        <td>${escapeHtml(r.moeda||"BRL")}</td>
        <td>${r.lead_time||"—"}</td>
        <td>${r.qtd_minima||"—"}</td>
        <td>${escapeHtml(r.validade_ate||"—")}</td>
      </tr>`).join("");
    tbody.querySelectorAll("tr[data-id]").forEach(tr=>{ tr.onclick=()=>openForm(tr.dataset.id); });
  }

  async function openForm(id){
    const r = (await api(API + "?produto_id=&fornecedor_id=")).pricelists.find(x=>String(x.id)===String(id));
    if(!r) return;
    current = r;
    document.getElementById("form-title").textContent = "Pricelist #" + r.id;
    document.getElementById("f-prod-id").value = r.produto_id || "";
    document.getElementById("f-prod").value = r.produto || "";
    document.getElementById("f-forn-id").value = r.fornecedor_id || "";
    document.getElementById("f-forn").value = r.fornecedor || "";
    document.getElementById("f-cod-forn").value = r.codigo_fornecedor || "";
    document.getElementById("f-preco").value = r.preco || "";
    document.getElementById("f-moeda").value = r.moeda || "BRL";
    document.getElementById("f-lead").value = r.lead_time || 0;
    document.getElementById("f-qtd-min").value = r.qtd_minima || 0;
    document.getElementById("f-de").value = r.validade_de || "";
    document.getElementById("f-ate").value = r.validade_ate || "";
    document.getElementById("form-msg").innerHTML = `<button type="button" class="so-btn danger" id="btn-del">Excluir</button>`;
    document.getElementById("btn-del")?.addEventListener("click", del);
    showView("form");
  }

  async function salvar(){
    const payload = {
      id: current ? current.id : undefined,
      produto_id: document.getElementById("f-prod-id").value,
      produto: document.getElementById("f-prod").value,
      fornecedor_id: document.getElementById("f-forn-id").value,
      fornecedor: document.getElementById("f-forn").value,
      codigo_fornecedor: document.getElementById("f-cod-forn").value,
      preco: Number(document.getElementById("f-preco").value)||0,
      moeda: document.getElementById("f-moeda").value || "BRL",
      lead_time: Number(document.getElementById("f-lead").value)||0,
      qtd_minima: Number(document.getElementById("f-qtd-min").value)||0,
      validade_de: document.getElementById("f-de").value,
      validade_ate: document.getElementById("f-ate").value,
    };
    const res = await api(API, {method:"POST", body: JSON.stringify(Object.assign({action:"save"}, payload))});
    const msg = document.getElementById("form-msg");
    if(res.status !== "ok"){ msg.textContent = res.message || "Erro"; msg.style.color = "#fca5a5"; return; }
    msg.textContent = "Salvo"; msg.style.color = "#86efac";
    await load();
    showView("list");
  }

  async function del(){
    if(!current || !confirm("Excluir pricelist?")) return;
    const res = await api(API, {method:"POST", body: JSON.stringify({action:"delete", id: current.id})});
    if(res.status !== "ok") return alert(res.message || "Erro");
    await load();
    showView("list");
  }

  document.getElementById("btn-refresh").onclick = load;
  document.getElementById("btn-salvar").onclick = salvar;
  document.getElementById("btn-voltar").onclick = ()=>{ showView("list"); load(); };
  document.getElementById("tab-list").onclick = ()=>{ showView("list"); document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active")); document.getElementById("tab-list").classList.add("active"); };
  document.getElementById("tab-novo").onclick = ()=>{
    current=null;
    document.getElementById("form-title").textContent="Nova Pricelist";
    document.querySelectorAll("#view-form input").forEach(i=>i.value="");
    document.getElementById("f-moeda").value="BRL";
    document.getElementById("f-lead").value="0";
    document.getElementById("f-qtd-min").value="0";
    document.getElementById("form-msg").textContent="";
    showView("form");
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active")); document.getElementById("tab-novo").classList.add("active");
  };

  load();
})();
</script>
</body>
</html>
