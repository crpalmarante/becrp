<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BECRP — Reforma Tributária (IBS/CBS)</title>
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/variaveis.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/icons.css">
<link rel="stylesheet" href="../css/grid.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/motion.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="../css/style.css">
<style>
.view{display:none}.view.active{display:block}
.card{border:1px solid var(--border-color);border-radius:var(--radius-panel);padding:16px;margin-bottom:16px;background:var(--surface-panel)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tab-btn{border:1px solid var(--border-color);background:var(--surface-panel);color:var(--text-secondary);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:var(--font-sm);font-weight:600}
.so-btn{border:1px solid var(--border-color);background:var(--surface-panel);color:var(--text-primary);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13px}
.so-btn.primary{background:rgba(20,184,166,.16);border-color:rgba(20,184,166,.45);color:#99f6e4}
.money{font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace;font-size:1.1rem}
.result-box{margin-top:16px;padding:14px;border-radius:8px;background:rgba(20,184,166,.08);border:1px solid rgba(20,184,166,.3)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ncm-row{display:grid;grid-template-columns:1fr 80px 80px 80px 40px;gap:8px;align-items:center;margin-bottom:8px}
.table-wrap{overflow:auto;border:1px solid var(--border-color);border-radius:var(--radius-panel)}
table.data{width:100%;border-collapse:collapse;font-size:var(--font-sm)}
table.data th{text-align:left;padding:10px 12px;background:rgba(255,255,255,.04);color:var(--text-muted);font-weight:600;border-bottom:1px solid var(--border-color);white-space:nowrap}
table.data td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
table.data tr:hover td{background:rgba(255,255,255,.03)}
.empty{text-align:center;padding:3rem;color:var(--text-muted)}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-brand" onclick="location='../index4.html'" style="cursor:pointer"><svg class="icon"><use href="../assets/images/icons.svg#icon-building"/></svg><span class="brand-text">BECRP</span></div>
    <nav class="sidebar-nav">
      <a class="menu-item" href="estoque.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-box"/></svg><span class="menu-label">Estoque</span></a>
      <a class="menu-item" href="compras.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-box"/></svg><span class="menu-label">Compras</span></a>
      <a class="menu-item active" href="fiscal-reforma.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-file-text"/></svg><span class="menu-label">Reforma Tributária</span></a>
      <a class="menu-item" href="configuracoes.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-settings"/></svg><span class="menu-label">Configurações</span></a>
      <a class="menu-item" href="../index4.html"><svg class="icon"><use href="../assets/images/icons.svg#icon-home"/></svg><span class="menu-label">Dashboard</span></a>
    </nav>
  </aside>
  <div class="main-area">
    <header class="topbar"><div class="topbar-brand"><span class="topbar-title">Reforma Tributária (IBS/CBS)</span></div>
      <div class="topbar-user" style="margin-left:auto;display:flex;align-items:center;gap:12px">
        <span class="topbar-user-info"><span id="user-name-display">—</span></span>
        <button class="topbar-icon-btn" data-logout title="Sair">Sair</button>
      </div>
    </header>
    <div class="main-content" style="padding:var(--space-5)">
      <div class="tabs">
        <button class="active" id="tab-calc">Calcular</button>
        <button id="tab-config">Alíquotas</button>
        <button id="tab-hist">Histórico</button>
      </div>

      <div class="view active" id="view-calc">
        <div class="card">
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Valor da operação</label>
              <input class="form-input" id="calc-valor" type="text" data-mask="moeda" inputmode="decimal" value="R$ 1.000,00">
            </div>
            <div class="form-group">
              <label class="form-label">NCM (opcional)</label>
              <input class="form-input" id="calc-ncm" placeholder="Ex.: 8517.12.00">
            </div>
          </div>
          <div class="toolbar" style="margin-top:12px">
            <button class="so-btn primary" id="btn-calc">Calcular</button>
            <button class="so-btn" id="btn-calc-limpar">Limpar</button>
          </div>
          <div id="calc-result" style="display:none">
            <div class="result-box">
              <div class="grid-2">
                <div>Valor operação<br><span class="money" id="res-valor">—</span></div>
                <div>CBS<br><span class="money" id="res-cbs">—</span></div>
                <div>IBS<br><span class="money" id="res-ibs">—</span></div>
                <div>Total com impostos<br><span class="money" id="res-total">—</span></div>
              </div>
              <p style="margin-top:10px;font-size:12px;color:var(--text-muted)">NCM: <span id="res-ncm">—</span> · CBS <span id="res-acbs">—</span>% · IBS <span id="res-aibs">—</span>% · Redução base <span id="res-red">—</span>%</p>
              <p style="font-size:12px;color:var(--text-muted)">Cálculo executado por COBOL.</p>
            </div>
          </div>
          <div id="calc-msg" style="margin-top:10px;color:#f87171"></div>
        </div>
      </div>

      <div class="view" id="view-hist">
        <div class="toolbar">
          <button class="tab-btn" id="btn-hist-refresh">Atualizar</button>
        </div>
        <div class="table-wrap" style="overflow:auto;border:1px solid var(--border-color);border-radius:var(--radius-panel)">
          <table class="data" style="width:100%;border-collapse:collapse;font-size:var(--font-sm)">
            <thead><tr><th>Data</th><th>Contexto</th><th>Valor</th><th>NCM</th><th>CBS</th><th>IBS</th><th>Total</th></tr></thead>
            <tbody id="hist-body"><tr><td colspan="7" class="empty">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="view" id="view-config">
        <div class="card">
          <h3 style="font-size:14px;margin-bottom:12px">Alíquota padrão</h3>
          <div class="grid-2">
            <div class="form-group"><label class="form-label">CBS (%)</label><input class="form-input" id="cfg-cbs" type="number" step="0.01"></div>
            <div class="form-group"><label class="form-label">IBS (%)</label><input class="form-input" id="cfg-ibs" type="number" step="0.01"></div>
            <div class="form-group"><label class="form-label">Redução base (%)</label><input class="form-input" id="cfg-red" type="number" step="0.01"></div>
          </div>
        </div>
        <div class="card">
          <h3 style="font-size:14px;margin-bottom:12px">Por NCM</h3>
          <div id="ncm-list"></div>
          <button class="so-btn" id="btn-add-ncm" style="margin-top:10px">+ NCM</button>
        </div>
        <div class="toolbar">
          <button class="so-btn primary" id="btn-save-cfg">Salvar alíquotas</button>
        </div>
        <div id="cfg-msg" style="margin-top:10px;color:#f87171"></div>
      </div>
    </div>
  </div>
</div>
<script src="../js/masks.js"></script>
<script src="../js/services/AuthService.js"></script>
<script src="../js/auth/page-boot.js"></script>
<script>
const API='/api/fiscal/reforma-tributaria';
const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active', b.id==='tab-'+(id.replace('view-',''))));
}
async function loadConfig(){
  const r=await AuthService.api(API);
  const a=r.aliquotas;
  document.getElementById('cfg-cbs').value=a.padrao.cbs;
  document.getElementById('cfg-ibs').value=a.padrao.ibs;
  document.getElementById('cfg-red').value=a.padrao.reducao;
  const box=document.getElementById('ncm-list');
  const ncm=a.por_ncm||{};
  box.innerHTML=Object.entries(ncm).map(([k,v])=>renderNcmRow(k,v.cbs,v.ibs,v.reducao)).join('');
}
function renderNcmRow(ncm,cbs,ibs,red){
  return `<div class="ncm-row">
    <input class="form-input nc-ncm" value="${ncm||''}" placeholder="NCM">
    <input class="form-input nc-cbs" type="number" step="0.01" value="${cbs!=null?cbs:''}" placeholder="CBS">
    <input class="form-input nc-ibs" type="number" step="0.01" value="${ibs!=null?ibs:''}" placeholder="IBS">
    <input class="form-input nc-red" type="number" step="0.01" value="${red!=null?red:''}" placeholder="Red">
    <button class="so-btn" onclick="this.parentElement.remove()">×</button>
  </div>`;
}
document.getElementById('tab-calc').onclick=()=>show('view-calc');
document.getElementById('tab-config').onclick=()=>show('view-config');
document.getElementById('tab-hist').onclick=()=>{ show('view-hist'); loadHistory(); };
document.getElementById('btn-calc').onclick=async ()=>{
  const body={acao:'calcular', valor:Mascaras.limparMoeda(document.getElementById('calc-valor').value), ncm:document.getElementById('calc-ncm').value, contexto:'manual'};
  const r=await AuthService.api(API,{method:'POST',body:JSON.stringify(body)});
  const msg=document.getElementById('calc-msg');
  if(r.status!=='ok'){msg.textContent=r.message||'Erro'; document.getElementById('calc-result').style.display='none'; return;}
  msg.textContent='';
  const c=r.calculo;
  document.getElementById('res-valor').textContent=money(c.valor_operacao);
  document.getElementById('res-cbs').textContent=money(c.cbs);
  document.getElementById('res-ibs').textContent=money(c.ibs);
  document.getElementById('res-total').textContent=money(c.total_com_impostos);
  document.getElementById('res-ncm').textContent=c.ncm||'—';
  document.getElementById('res-acbs').textContent=c.aliquota_cbs;
  document.getElementById('res-aibs').textContent=c.aliquota_ibs;
  document.getElementById('res-red').textContent=c.reducao_base;
  document.getElementById('calc-result').style.display='block';
};
document.getElementById('btn-calc-limpar').onclick=()=>{
  document.getElementById('calc-result').style.display='none';
  document.getElementById('calc-msg').textContent='';
};
document.getElementById('btn-add-ncm').onclick=()=>{
  document.getElementById('ncm-list').insertAdjacentHTML('beforeend', renderNcmRow('','','',''));
};
document.getElementById('btn-save-cfg').onclick=async ()=>{
  const padrao={cbs:document.getElementById('cfg-cbs').value, ibs:document.getElementById('cfg-ibs').value, reducao:document.getElementById('cfg-red').value};
  const por_ncm={};
  document.querySelectorAll('.ncm-row').forEach(row=>{
    const ncm=row.querySelector('.nc-ncm').value.trim();
    if(ncm) por_ncm[ncm]={cbs:row.querySelector('.nc-cbs').value, ibs:row.querySelector('.nc-ibs').value, reducao:row.querySelector('.nc-red').value};
  });
  const r=await AuthService.api(API,{method:'POST',body:JSON.stringify({acao:'config', padrao, por_ncm})});
  const msg=document.getElementById('cfg-msg');
  msg.style.color=r.status==='ok'?'#86efac':'#f87171';
  msg.textContent=r.status==='ok'?'Salvo':(r.message||'Erro');
};
async function loadHistory(){
  const r=await AuthService.api(API+'/history');
  const tb=document.getElementById('hist-body');
  if(r.status!=='ok'||!r.historico.length){ tb.innerHTML='<tr><td colspan="7" class="empty">Nenhum cálculo no histórico</td></tr>'; return; }
  tb.innerHTML=r.historico.map(h=>{
    const c=h.resultado||{};
    return `<tr><td>${h.calculado_em||''}</td><td>${h.contexto||'manual'}</td><td class="money">${money(c.valor_operacao||0)}</td><td>${h.ncm||'—'}</td><td class="money">${money(c.cbs||0)}</td><td class="money">${money(c.ibs||0)}</td><td class="money">${money(c.total_com_impostos||0)}</td></tr>`;
  }).join('');
}
document.getElementById('btn-hist-refresh').onclick=loadHistory;
loadConfig();
</script>
</body>
</html>
