<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BECRP — Recebimento</title>
  <meta name="theme-color" content="#714B67">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/variaveis.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/icons.css">
  <link rel="stylesheet" href="../css/grid.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/motion.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .rcv-toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
    .rcv-toolbar select, .rcv-toolbar input { min-width:140px; }
    .rcv-table { width:100%; border-collapse:collapse; }
    .rcv-table th, .rcv-table td { padding:10px 12px; text-align:left; border-bottom:1px solid rgba(255,255,255,.08); }
    .rcv-table th { font-size:12px; text-transform:uppercase; opacity:.7; }
    .rcv-badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; }
    .st-draft { background:#555; }
    .st-verified { background:#8a6d3b; }
    .st-completed { background:#2d6a4f; }
    .st-cancelled { background:#6c2b2b; }
    .rcv-detail { margin-top:20px; padding:16px; border:1px solid rgba(255,255,255,.1); border-radius:8px; }
    .rcv-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .rcv-items-edit { display:flex; flex-direction:column; gap:8px; }
    .rcv-item-row { display:grid; grid-template-columns: 1fr 100px 100px auto; gap:8px; align-items:center; }
    .rcv-msg { margin:8px 0; font-size:14px; }
    .rcv-msg.err { color:#f87171; }
    .rcv-msg.ok { color:#4ade80; }
    .rcv-unmatched { color:#fbbf24; font-size:12px; }
    .rcv-nfe-meta { font-size:13px; opacity:.85; margin:8px 0; word-break:break-all; }
    .rcv-link-row { display:flex; gap:6px; align-items:center; margin-top:4px; flex-wrap:wrap; }
    .rcv-link-row input { max-width:180px; }
    .rcv-suggest { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    .rcv-suggest button { font-size:12px; }
    .diff-ok { color:#4ade80; }
    .diff-bad { color:#fbbf24; font-weight:600; }
    .diff-miss { color:#f87171; font-weight:600; }
    .rcv-scan { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:12px 0; padding:10px; border:1px dashed rgba(255,255,255,.2); border-radius:8px; }
    .rcv-scan input { min-width:200px; flex:1; }
    .rcv-notes { width:100%; min-width:120px; font-size:12px; }
    .res-verified { color:#4ade80; }
    .res-quantity_difference, .res-damaged { color:#fbbf24; }
    .res-missing, .res-rejected { color:#f87171; }
  </style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-brand" onclick="location='../index4.html'" style="cursor:pointer">
      <svg class="icon"><use href="../assets/images/icons.svg#icon-building"/></svg>
      <span class="brand-text">BECRP</span>
    </div>
    <nav class="sidebar-nav">
      <a class="menu-item" href="estoque.html">
        <svg class="icon"><use href="../assets/images/icons.svg#icon-box"/></svg>
        <span class="menu-label">Estoque</span>
      </a>
      <a class="menu-item active" href="recebimento.html">
        <svg class="icon"><use href="../assets/images/icons.svg#icon-truck"/></svg>
        <span class="menu-label">Recebimento</span>
      </a>
      <a class="menu-item" href="produtos.html">
        <svg class="icon"><use href="../assets/images/icons.svg#icon-box"/></svg>
        <span class="menu-label">Produtos</span>
      </a>
      <a class="menu-item" href="parceiros.html?role=SUPPLIER">
        <svg class="icon"><use href="../assets/images/icons.svg#icon-users"/></svg>
        <span class="menu-label">Fornecedores</span>
      </a>
      <a class="menu-item" href="../index4.html">
        <svg class="icon"><use href="../assets/images/icons.svg#icon-home"/></svg>
        <span class="menu-label">Dashboard</span>
      </a>
    </nav>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-brand">
        <svg class="icon"><use href="../assets/images/icons.svg#icon-truck"/></svg>
        <span class="topbar-title">Recebimento</span>
      </div>
      <div class="topbar-user" style="margin-left:auto">
        <button class="topbar-icon-btn" id="btn-xml" title="Importar NF-e XML">
          <svg class="icon"><use href="../assets/images/icons.svg#icon-upload"/></svg>
        </button>
        <button class="topbar-icon-btn" id="btn-new" title="Novo recebimento">
          <svg class="icon"><use href="../assets/images/icons.svg#icon-plus"/></svg>
        </button>
        <span class="topbar-user-info"><span id="user-name-display">—</span></span>
      </div>
    </header>

    <div class="workspace">
      <div id="workspace-view" style="display:flex">
        <div class="workspace-header">
          <div class="workspace-breadcrumb">BECRP / Inventário / Recebimento</div>
          <h2 class="workspace-title">Entrada de mercadorias</h2>
        </div>
        <div class="workspace-content">
          <div class="rcv-toolbar">
            <select class="form-input" id="filter-estab"></select>
            <select class="form-input" id="filter-status">
              <option value="">Todos status</option>
              <option value="draft">Rascunho</option>
              <option value="verified">Conferido</option>
              <option value="completed">Concluído</option>
              <option value="cancelled">Cancelado</option>
            </select>
            <button class="dialog-btn dialog-btn-secondary" id="btn-refresh">Atualizar</button>
            <button class="dialog-btn dialog-btn-primary" id="btn-xml-bar">Importar XML</button>
            <input type="file" id="xml-file" accept=".xml,text/xml,application/xml" style="display:none">
          </div>
          <div id="msg" class="rcv-msg"></div>
          <div id="list"></div>
          <div id="detail" class="rcv-detail" style="display:none"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="dialog-overlay" id="new-modal" style="display:none">
  <div class="dialog-box" style="max-width:560px">
    <div class="dialog-header">
      <h3 class="dialog-title">Novo recebimento</h3>
      <button class="dialog-close" id="btn-close-modal">&times;</button>
    </div>
    <div class="dialog-body">
      <div class="field">
        <label>Estabelecimento</label>
        <select class="form-input" id="new-estab"></select>
      </div>
      <div class="field">
        <label>Fornecedor / origem</label>
        <input class="form-input" id="new-fornecedor" placeholder="Ex.: CD Central">
      </div>
      <div class="field">
        <label>Documento ref.</label>
        <input class="form-input" id="new-doc" placeholder="NF / romaneio">
      </div>
      <div class="field">
        <label>Itens</label>
        <div class="rcv-items-edit" id="new-items"></div>
        <button type="button" class="dialog-btn dialog-btn-secondary" id="btn-add-item" style="margin-top:8px">+ item</button>
      </div>
      <div class="form-error" id="new-error"></div>
    </div>
    <div class="dialog-footer">
      <button class="dialog-btn dialog-btn-secondary" id="btn-cancel-modal">Cancelar</button>
      <button class="dialog-btn dialog-btn-primary" id="btn-save-new">Criar</button>
    </div>
  </div>
</div>

<div class="dialog-overlay" id="xml-modal" style="display:none">
  <div class="dialog-box" style="max-width:480px">
    <div class="dialog-header">
      <h3 class="dialog-title">Importar NF-e (XML)</h3>
      <button class="dialog-close" id="btn-close-xml">&times;</button>
    </div>
    <div class="dialog-body">
      <p class="mode-note">Upload manual — parse fiscal cria rascunho de recebimento. Não move estoque.</p>
      <div class="field">
        <label>Estabelecimento (opcional — sobrescreve CNPJ dest.)</label>
        <select class="form-input" id="xml-estab">
          <option value="">Detectar pelo CNPJ</option>
        </select>
      </div>
      <div class="field">
        <label>Arquivo XML</label>
        <input class="form-input" type="file" id="xml-file-modal" accept=".xml,text/xml,application/xml">
      </div>
      <div class="form-error" id="xml-error"></div>
    </div>
    <div class="dialog-footer">
      <button class="dialog-btn dialog-btn-secondary" id="btn-xml-demo">Demo sample</button>
      <button class="dialog-btn dialog-btn-secondary" id="btn-cancel-xml">Cancelar</button>
      <button class="dialog-btn dialog-btn-primary" id="btn-import-xml">Importar</button>
    </div>
  </div>
</div>

<script src="../js/services/AuthService.js"></script>
<script>
(function () {
  const auth = AuthService.requireAuth("../index.html");
  if (!auth) return;
  document.getElementById("user-name-display").textContent = auth.user.nome || auth.user.usuario || "Usuário";

  const STATUS_LABEL = {
    draft: "Rascunho",
    verified: "Conferido",
    completed: "Concluído",
    cancelled: "Cancelado",
  };
  const RESULT_LABEL = {
    verified: "OK",
    quantity_difference: "Qtd ≠",
    damaged: "Avaria",
    missing: "Falta",
    rejected: "Rejeitado",
  };

  let empresas = {};
  let selectedId = null;

  function msg(text, ok) {
    const el = document.getElementById("msg");
    el.textContent = text || "";
    el.className = "rcv-msg " + (ok ? "ok" : text ? "err" : "");
  }

  async function loadEmpresas() {
    empresas = {};
    let lista = [];
    const mine = await AuthService.api("/api/auth/minhas-empresas");
    if (mine.status === "ok" && Array.isArray(mine.empresas) && mine.empresas.length) {
      lista = mine.empresas;
    } else {
      const data = await AuthService.api("/api/admin/empresas");
      if (data.status === "ok" && Array.isArray(data.empresas)) lista = data.empresas;
    }
    if (!lista.length) {
      lista = [
        { id: "matriz", nome: "Matriz" },
        { id: "filial_sp", nome: "Filial São Paulo" },
        { id: "filial_rj", nome: "Filial Rio de Janeiro" },
      ];
    }
    lista.forEach((e) => { empresas[e.id] = e; });
    const opts = Object.keys(empresas).map((id) => {
      const nome = empresas[id].nome || id;
      return `<option value="${id}">${nome}</option>`;
    }).join("");
    document.getElementById("filter-estab").innerHTML =
      `<option value="">Todas lojas</option>` + opts;
    document.getElementById("new-estab").innerHTML = opts || `<option value="matriz">Matriz</option>`;
    document.getElementById("xml-estab").innerHTML =
      `<option value="">Detectar pelo CNPJ</option>` + opts;
  }

  async function loadList() {
    const estab = document.getElementById("filter-estab").value;
    const status = document.getElementById("filter-status").value;
    const qs = new URLSearchParams();
    if (estab) qs.set("estabelecimento_id", estab);
    if (status) qs.set("status", status);
    const data = await AuthService.api("/api/receiving?" + qs.toString());
    if (data.status !== "ok") {
      msg(data.message || "Falha ao listar");
      return;
    }
    const rows = data.receivings || [];
    if (!rows.length) {
      document.getElementById("list").innerHTML = "<p class='mode-note'>Nenhum recebimento.</p>";
      return;
    }
    document.getElementById("list").innerHTML = `
      <table class="rcv-table">
        <thead><tr>
          <th>#</th><th>Loja</th><th>Fornecedor</th><th>Itens</th><th>Status</th><th></th>
        </tr></thead>
        <tbody>
          ${rows.map((r) => {
            const loja = (empresas[r.estabelecimento_id] || {}).nome || r.estabelecimento_id;
            const n = (r.items || []).length;
            return `<tr>
              <td>${r.id}</td>
              <td>${loja}</td>
              <td>${r.fornecedor_nome || "—"}</td>
              <td>${n}</td>
              <td><span class="rcv-badge st-${r.status}">${STATUS_LABEL[r.status] || r.status}</span></td>
              <td><button class="dialog-btn dialog-btn-secondary" data-open="${r.id}">Abrir</button></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>`;
    document.querySelectorAll("[data-open]").forEach((btn) => {
      btn.addEventListener("click", () => openDetail(btn.dataset.open));
    });
  }

  async function openDetail(id) {
    selectedId = id;
    const data = await AuthService.api("/api/receiving/" + id);
    if (data.status !== "ok") {
      msg(data.message || "Não encontrado");
      return;
    }
    const r = data.receiving;
    const loja = (empresas[r.estabelecimento_id] || {}).nome || r.estabelecimento_id;
    const nfe = r.nfe || null;
    const unmatched = (r.items || []).filter((it) => !String(it.produto_id || "").trim()).length;

    const canEditQty = r.status === "draft" || r.status === "verified";
    const itemsHtml = (r.items || []).map((it, idx) => {
      const matched = String(it.produto_id || "").trim();
      const ean = (it.nfe_item && it.nfe_item.ean) || "";
      const cforn = (it.nfe_item && it.nfe_item.codigo_fornecedor) || "";
      const exp = Number(it.qty_expected || 0);
      const good = it.qty_verified != null ? Number(it.qty_verified) : exp;
      const dmg = Number(it.qty_damaged || 0);
      const diff = good - exp;
      const result = it.verify_result || (r.verification && r.verification.items && r.verification.items[idx]
        ? r.verification.items[idx].result : "");
      const diffCls = diff === 0 && dmg === 0 ? "diff-ok" : (good <= 0 ? "diff-miss" : "diff-bad");
      const label = matched
        ? `${matched} ${it.produto_nome ? "· " + it.produto_nome : ""}`
        : `<span class="rcv-unmatched">sem match</span> ${it.produto_nome || (it.nfe_item && it.nfe_item.descricao) || ""}`;
      const meta = [
        ean ? `EAN ${ean}` : "",
        cforn ? `cProd ${cforn}` : "",
        `match=${it.match || "—"}`,
      ].filter(Boolean).join(" · ");
      let linkUi = "";
      if (!matched && canEditQty) {
        const sug = (it.suggestions || []).slice(0, 4).map((s) =>
          `<button type="button" class="dialog-btn dialog-btn-secondary btn-sug" data-idx="${idx}" data-pid="${s.id}" data-nome="${(s.nome || "").replace(/"/g, "&quot;")}">#${s.id} ${s.nome || ""}</button>`
        ).join("");
        linkUi = `<div class="rcv-link-row">
             <input class="form-input link-q" data-idx="${idx}" placeholder="buscar nome / EAN / id" autocomplete="off">
             <input class="form-input link-pid" data-idx="${idx}" placeholder="id" style="max-width:70px">
             <button class="dialog-btn dialog-btn-secondary btn-link" data-idx="${idx}">Vincular</button>
           </div>
           <div class="rcv-suggest" data-idx="${idx}">${sug}</div>`;
      }
      const qtyCells = canEditQty
        ? `<td><input class="form-input qty-ver" data-idx="${idx}" data-pid="${matched}" type="number" min="0" value="${good}"></td>
           <td><input class="form-input qty-dmg" data-idx="${idx}" type="number" min="0" value="${dmg}"></td>
           <td class="${diffCls} diff-cell" data-idx="${idx}">${diff > 0 ? "+" : ""}${diff}</td>
           <td><input class="form-input rcv-notes notes-ver" data-idx="${idx}" placeholder="obs." value="${(it.notes || "").replace(/"/g, "&quot;")}"></td>
           <td class="res-cell res-${result || ""}" data-idx="${idx}">${RESULT_LABEL[result] || (result || "—")}</td>`
        : `<td>${it.qty_verified != null ? it.qty_verified : "—"}</td>
           <td>${dmg || "—"}</td>
           <td class="${diffCls}">${diff > 0 ? "+" : ""}${diff}</td>
           <td>${it.notes || "—"}</td>
           <td class="res-${result || ""}">${RESULT_LABEL[result] || result || "—"}</td>`;
      return `<tr>
        <td>${label}${meta ? `<div style="opacity:.6;font-size:12px">${meta}</div>` : ""}${linkUi}</td>
        <td>${exp}</td>
        ${qtyCells}
      </tr>`;
    }).join("");

    const inv = r.inventory
      ? `<p>Inventário: ${r.inventory.status} · movimentos ${(r.inventory.movement_ids || []).join(", ") || "—"}</p>`
      : "";

    const nfeHtml = nfe
      ? `<div class="rcv-nfe-meta">NF-e ${nfe.numero || "—"}/${nfe.serie || "—"} · chave ${nfe.chave || "—"}
         ${unmatched ? ` · <span class="rcv-unmatched">${unmatched} item(ns) sem produto</span>` : ""}</div>`
      : (unmatched ? `<p class="rcv-unmatched">${unmatched} item(ns) sem produto vinculado</p>` : "");

    const ver = r.verification;
    const verHtml = ver
      ? `<p class="rcv-nfe-meta">Conferência: ${ver.status || "—"} · método=${ver.method || "—"} ·
         divergências=<strong>${ver.differences_count != null ? ver.differences_count : "—"}</strong>
         ${ver.started_at ? " · início " + ver.started_at : ""}
         ${ver.completed_at ? " · fim " + ver.completed_at : ""}</p>`
      : "";

    const scanHtml = canEditQty && !unmatched
      ? `<div class="rcv-scan">
           <label>Bip / EAN</label>
           <input class="form-input" id="scan-code" placeholder="Escaneie ou digite EAN + Enter" autocomplete="off">
           <button class="dialog-btn dialog-btn-secondary" id="btn-scan">+1</button>
           <span class="mode-note">entra na qty boa; inventário só no Concluir</span>
         </div>`
      : "";

    let actions = "";
    if (r.status === "draft") {
      actions += `<button class="dialog-btn dialog-btn-secondary" id="act-verify">Finalizar conferência</button>`;
      actions += `<button class="dialog-btn dialog-btn-primary" id="act-complete">Conferir + concluir estoque</button>`;
      actions += `<button class="dialog-btn dialog-btn-secondary" id="act-cancel">Cancelar</button>`;
    } else if (r.status === "verified") {
      actions += `<button class="dialog-btn dialog-btn-secondary" id="act-verify">Regravar conferência</button>`;
      actions += `<button class="dialog-btn dialog-btn-secondary" id="act-reopen">Reabrir conferência</button>`;
      actions += `<button class="dialog-btn dialog-btn-primary" id="act-complete">Concluir (entra estoque)</button>`;
      actions += `<button class="dialog-btn dialog-btn-secondary" id="act-cancel">Cancelar</button>`;
    }

    const box = document.getElementById("detail");
    box.style.display = "block";
    box.innerHTML = `
      <h3>Recebimento #${r.id}</h3>
      <p>${loja} · ${r.fornecedor_nome || "sem fornecedor"} · ${r.documento_ref || "sem doc"} ·
        origem=${r.origem || "—"} ·
        <span class="rcv-badge st-${r.status}">${STATUS_LABEL[r.status] || r.status}</span></p>
      ${nfeHtml}
      ${verHtml}
      ${r.nota ? `<p>${r.nota}</p>` : ""}
      ${scanHtml}
      <table class="rcv-table">
        <thead><tr>
          <th>Produto</th><th>Esperado</th><th>Bom</th><th>Avaria</th><th>Δ</th><th>Obs.</th><th>Resultado</th>
        </tr></thead>
        <tbody>${itemsHtml}</tbody>
      </table>
      ${inv}
      <div class="rcv-actions">${actions}</div>`;

    async function doLink(idx, pid, nome) {
      if (!pid) return msg("informe produto para vincular");
      const res = await AuthService.api("/api/receiving/" + id + "/link-product", {
        method: "POST",
        body: JSON.stringify({
          item_index: Number(idx),
          produto_id: String(pid),
          produto_nome: nome || undefined,
          remember: true,
        }),
      });
      if (res.status !== "ok") return msg(res.message || "Falha ao vincular");
      msg("Produto vinculado (referência fornecedor salva).", true);
      await loadList();
      openDetail(id);
    }

    box.querySelectorAll(".btn-link").forEach((btn) => {
      btn.onclick = async () => {
        const idx = btn.dataset.idx;
        const inp = box.querySelector(`.link-pid[data-idx="${idx}"]`);
        await doLink(idx, (inp && inp.value || "").trim());
      };
    });
    box.querySelectorAll(".btn-sug").forEach((btn) => {
      btn.onclick = () => doLink(btn.dataset.idx, btn.dataset.pid, btn.dataset.nome);
    });

    const searchTimers = {};
    box.querySelectorAll(".link-q").forEach((inp) => {
      inp.addEventListener("input", () => {
        const idx = inp.dataset.idx;
        clearTimeout(searchTimers[idx]);
        searchTimers[idx] = setTimeout(async () => {
          const q = inp.value.trim();
          const wrap = box.querySelector(`.rcv-suggest[data-idx="${idx}"]`);
          if (!wrap) return;
          if (q.length < 1) {
            wrap.innerHTML = "";
            return;
          }
          const res = await AuthService.api("/api/receiving/product-search?q=" + encodeURIComponent(q) + "&limit=6");
          if (res.status !== "ok") return;
          wrap.innerHTML = (res.produtos || []).map((s) =>
            `<button type="button" class="dialog-btn dialog-btn-secondary btn-sug" data-idx="${idx}" data-pid="${s.id}" data-nome="${(s.nome || "").replace(/"/g, "&quot;")}">#${s.id} ${s.nome || ""}${s.codigo_barras ? " · " + s.codigo_barras : ""}</button>`
          ).join("") || `<span class="mode-note">nenhum</span>`;
          wrap.querySelectorAll(".btn-sug").forEach((btn) => {
            btn.onclick = () => doLink(btn.dataset.idx, btn.dataset.pid, btn.dataset.nome);
          });
          const first = (res.produtos || [])[0];
          const pidInp = box.querySelector(`.link-pid[data-idx="${idx}"]`);
          if (first && pidInp && /^\d+$/.test(q)) pidInp.value = first.id;
        }, 220);
      });
    });

    const collectItems = () => {
      const map = {};
      box.querySelectorAll(".qty-ver").forEach((inp) => {
        const idx = Number(inp.dataset.idx);
        map[idx] = map[idx] || { item_index: idx, produto_id: inp.dataset.pid };
        map[idx].qty_verified = Number(inp.value || 0);
      });
      box.querySelectorAll(".qty-dmg").forEach((inp) => {
        const idx = Number(inp.dataset.idx);
        map[idx] = map[idx] || { item_index: idx };
        map[idx].qty_damaged = Number(inp.value || 0);
      });
      box.querySelectorAll(".notes-ver").forEach((inp) => {
        const idx = Number(inp.dataset.idx);
        map[idx] = map[idx] || { item_index: idx };
        map[idx].notes = inp.value.trim();
      });
      return Object.keys(map).map((k) => map[k]);
    };

    function liveClassify(exp, good, dmg) {
      if (good <= 0 && dmg <= 0 && exp > 0) return "missing";
      if (dmg > 0 && good === 0) return "damaged";
      if (good !== exp || dmg > 0) return good !== exp ? "quantity_difference" : "damaged";
      return "verified";
    }

    function refreshDiffs() {
      box.querySelectorAll(".qty-ver").forEach((inp) => {
        const idx = inp.dataset.idx;
        const row = inp.closest("tr");
        const exp = Number((r.items[idx] || {}).qty_expected || 0);
        const good = Number(inp.value || 0);
        const dmgInp = box.querySelector(`.qty-dmg[data-idx="${idx}"]`);
        const dmg = dmgInp ? Number(dmgInp.value || 0) : 0;
        const diff = good - exp;
        const diffEl = box.querySelector(`.diff-cell[data-idx="${idx}"]`);
        const resEl = box.querySelector(`.res-cell[data-idx="${idx}"]`);
        if (diffEl) {
          diffEl.textContent = (diff > 0 ? "+" : "") + diff;
          diffEl.className = "diff-cell " + (diff === 0 && dmg === 0 ? "diff-ok" : good <= 0 ? "diff-miss" : "diff-bad");
        }
        if (resEl) {
          const result = liveClassify(exp, good, dmg);
          resEl.textContent = RESULT_LABEL[result] || result;
          resEl.className = "res-cell res-" + result;
        }
      });
    }
    box.querySelectorAll(".qty-ver, .qty-dmg").forEach((inp) => {
      inp.addEventListener("input", refreshDiffs);
    });

    async function doScan() {
      const inp = document.getElementById("scan-code");
      if (!inp) return;
      const code = inp.value.trim();
      if (!code) return msg("informe código");
      const res = await AuthService.api("/api/receiving/" + id + "/scan", {
        method: "POST",
        body: JSON.stringify({ barcode: code, qty: 1 }),
      });
      if (res.status !== "ok") return msg(res.message || "Bip falhou");
      inp.value = "";
      inp.focus();
      msg("Bip OK · item #" + (res.item_index + 1) + " → qty " + res.item.qty_verified, true);
      await loadList();
      openDetail(id);
    }
    const scanInp = document.getElementById("scan-code");
    const scanBtn = document.getElementById("btn-scan");
    if (scanBtn) scanBtn.onclick = doScan;
    if (scanInp) {
      scanInp.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          doScan();
        }
      });
    }

    const verifyBtn = document.getElementById("act-verify");
    if (verifyBtn) {
      verifyBtn.onclick = async () => {
        const res = await AuthService.api("/api/receiving/" + id + "/verify", {
          method: "POST",
          body: JSON.stringify({ items: collectItems(), method: "manual" }),
        });
        if (res.status !== "ok") return msg(res.message || "Falha na conferência");
        const n = (res.receiving.verification && res.receiving.verification.differences_count) || 0;
        msg(n ? "Conferido com " + n + " divergência(s)." : "Conferido sem divergências.", true);
        await loadList();
        openDetail(id);
      };
    }
    const reopenBtn = document.getElementById("act-reopen");
    if (reopenBtn) {
      reopenBtn.onclick = async () => {
        const res = await AuthService.api("/api/receiving/" + id + "/reopen-verify", {
          method: "POST",
          body: JSON.stringify({}),
        });
        if (res.status !== "ok") return msg(res.message || "Falha ao reabrir");
        msg("Conferência reaberta.", true);
        await loadList();
        openDetail(id);
      };
    }
    const completeBtn = document.getElementById("act-complete");
    if (completeBtn) {
      completeBtn.onclick = async () => {
        if (r.status === "draft") {
          const v = await AuthService.api("/api/receiving/" + id + "/verify", {
            method: "POST",
            body: JSON.stringify({ items: collectItems(), method: "manual" }),
          });
          if (v.status !== "ok") return msg(v.message || "Falha na conferência");
        }
        const res = await AuthService.api("/api/receiving/" + id + "/complete", {
          method: "POST",
          body: JSON.stringify({}),
        });
        if (res.status !== "ok") return msg(res.message || "Falha ao concluir");
        msg("Concluído — estoque atualizado (só qty boa).", true);
        await loadList();
        openDetail(id);
      };
    }
    const cancelBtn = document.getElementById("act-cancel");
    if (cancelBtn) {
      cancelBtn.onclick = async () => {
        const res = await AuthService.api("/api/receiving/" + id + "/cancel", {
          method: "POST",
          body: JSON.stringify({ motivo: "cancelado na UI" }),
        });
        if (res.status !== "ok") return msg(res.message || "Falha ao cancelar");
        msg("Cancelado.", true);
        await loadList();
        openDetail(id);
      };
    }
  }

  function addItemRow(pid, qty) {
    const wrap = document.getElementById("new-items");
    const row = document.createElement("div");
    row.className = "rcv-item-row";
    row.innerHTML = `
      <input class="form-input item-pid" placeholder="produto_id" value="${pid || ""}">
      <input class="form-input item-nome" placeholder="nome (opc.)">
      <input class="form-input item-qty" type="number" min="1" placeholder="qty" value="${qty || 1}">
      <button type="button" class="dialog-btn dialog-btn-secondary item-rm">×</button>`;
    row.querySelector(".item-rm").onclick = () => row.remove();
    wrap.appendChild(row);
  }

  function openModal() {
    document.getElementById("new-error").textContent = "";
    document.getElementById("new-fornecedor").value = "";
    document.getElementById("new-doc").value = "";
    document.getElementById("new-items").innerHTML = "";
    addItemRow("4", 40);
    document.getElementById("new-modal").style.display = "flex";
  }
  function closeModal() {
    document.getElementById("new-modal").style.display = "none";
  }

  document.getElementById("btn-new").onclick = openModal;
  document.getElementById("btn-close-modal").onclick = closeModal;
  document.getElementById("btn-cancel-modal").onclick = closeModal;
  document.getElementById("btn-add-item").onclick = () => addItemRow("", 1);
  document.getElementById("btn-refresh").onclick = () => { msg(""); loadList(); };
  document.getElementById("filter-estab").onchange = loadList;
  document.getElementById("filter-status").onchange = loadList;

  function openXmlModal() {
    document.getElementById("xml-error").textContent = "";
    document.getElementById("xml-file-modal").value = "";
    document.getElementById("xml-modal").style.display = "flex";
  }
  function closeXmlModal() {
    document.getElementById("xml-modal").style.display = "none";
  }
  document.getElementById("btn-xml").onclick = openXmlModal;
  document.getElementById("btn-xml-bar").onclick = openXmlModal;
  document.getElementById("btn-close-xml").onclick = closeXmlModal;
  document.getElementById("btn-cancel-xml").onclick = closeXmlModal;

  async function importXmlPayload(body) {
    const err = document.getElementById("xml-error");
    err.textContent = "";
    const res = await AuthService.api("/api/receiving/from-xml", {
      method: "POST",
      body: JSON.stringify(body),
    });
    if (res.status !== "ok") {
      err.textContent = res.message || "Falha ao importar";
      msg(res.message || "Falha ao importar XML");
      return null;
    }
    closeXmlModal();
    const pending = (res.receiving.nfe && res.receiving.nfe.itens_sem_match) || 0;
    msg(
      "NF-e importada → recebimento #" + res.receiving.id +
        (pending ? ` (${pending} item(ns) sem match)` : ""),
      true
    );
    await loadList();
    openDetail(res.receiving.id);
    return res.receiving;
  }

  document.getElementById("btn-import-xml").onclick = async () => {
    const file = document.getElementById("xml-file-modal").files[0];
    if (!file) {
      document.getElementById("xml-error").textContent = "Selecione um XML";
      return;
    }
    const xml = await file.text();
    const estab = document.getElementById("xml-estab").value;
    const body = { xml };
    if (estab) body.estabelecimento_id = estab;
    await importXmlPayload(body);
  };

  document.getElementById("btn-xml-demo").onclick = async () => {
    const estab = document.getElementById("xml-estab").value;
    const body = { sample: "demo" };
    if (estab) body.estabelecimento_id = estab;
    await importXmlPayload(body);
  };

  document.getElementById("btn-save-new").onclick = async () => {
    const err = document.getElementById("new-error");
    err.textContent = "";
    const items = Array.from(document.querySelectorAll("#new-items .rcv-item-row")).map((row) => ({
      produto_id: row.querySelector(".item-pid").value.trim(),
      produto_nome: row.querySelector(".item-nome").value.trim(),
      qty: Number(row.querySelector(".item-qty").value || 0),
    })).filter((i) => i.produto_id && i.qty > 0);
    const body = {
      estabelecimento_id: document.getElementById("new-estab").value,
      fornecedor_nome: document.getElementById("new-fornecedor").value.trim(),
      documento_ref: document.getElementById("new-doc").value.trim(),
      origem: "manual",
      items,
    };
    const res = await AuthService.api("/api/receiving", {
      method: "POST",
      body: JSON.stringify(body),
    });
    if (res.status !== "ok") {
      err.textContent = res.message || "Erro ao criar";
      return;
    }
    closeModal();
    msg("Recebimento #" + res.receiving.id + " criado.", true);
    await loadList();
    openDetail(res.receiving.id);
  };

  (async function boot() {
    await loadEmpresas();
    await loadList();
  })();
})();
</script>
</body>
</html>
